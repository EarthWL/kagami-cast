# Product identity. build-all.sh reads this file and passes the values to the
# GUI build (window title, .exe version info) and to the installer.
#
# APP_DISPLAY_NAME  name users see (window title, Start menu, Add/Remove Programs).
#                   ASCII only. (File/folder names use "KagamiCast": KagamiCast.exe,
#                   %LOCALAPPDATA%\KagamiCast — fixed in app/CMakeLists.txt, app/main.cpp,
#                   package.sh and installer/setup.iss.)
# APP_PUBLISHER     shown in Add/Remove Programs.
# APP_URL           project page (fill in once the GitHub repo exists).
# APP_INSTALLER_ID  Inno Setup AppId. NEVER change it after the first public
#                   release: Windows uses it to recognise upgrades/uninstalls.

APP_DISPLAY_NAME="Kagami Cast"
APP_PUBLISHER="Kagami Cast contributors"
APP_URL="https://github.com/EarthWL/kagami-cast"
APP_INSTALLER_ID="{52C61811-627A-483B-B603-1048F3A81240}"
